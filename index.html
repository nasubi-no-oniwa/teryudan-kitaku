<style>

:root{
  --ink:#16180f;
  --olive:#4b5524;
  --warn:#f2c230;
  --paper:#f3ecd8;
  --red:#d33b26;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#bcd3e0;color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-weight:900;font-size:15px;padding:5px 11px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);border:2px solid var(--ink)}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.bub.home{background:var(--warn);font-size:18px}
.bub.loud{font-family:var(--disp);font-weight:400;font-size:19px}
#mark{position:absolute;transform:translate(-50%,-100%);color:var(--red);font-size:18px;line-height:1;text-shadow:0 0 3px #fff,0 0 6px #fff;pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;justify-content:center;pointer-events:none}
.stat{background:rgba(22,24,15,.8);color:var(--paper);border-radius:10px;padding:5px 10px 6px;min-width:84px;text-align:center}
.stat span{display:block;font-size:11px;letter-spacing:.06em;opacity:.8;font-weight:700;white-space:nowrap}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--warn)}
.stat b small{font-family:var(--body);font-size:12px;font-weight:700;margin-left:2px;color:var(--paper)}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7);pointer-events:none;padding:0 16px;text-wrap:balance}
#ctrl{position:absolute;left:0;right:0;bottom:0;height:200px;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
#ctrl>*{pointer-events:auto}
.slot{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:116px;height:116px;margin-left:-58px}
#noThrow{position:absolute;inset:8px;border-radius:50%;border:3px dashed var(--ink);background:var(--paper);color:var(--ink);font:900 15px var(--body);line-height:1.2;cursor:pointer;padding:0}
#throwBtn{position:absolute;inset:0;border-radius:50%;border:0;background:var(--red);color:#fff;font-family:var(--disp);font-size:24px;cursor:pointer;box-shadow:0 5px 0 #7b1b0f,0 0 0 5px rgba(255,255,255,.85);touch-action:none;letter-spacing:.04em;--f:1;padding:0}
#throwBtn::before{content:"";position:absolute;inset:-11px;border-radius:50%;background:conic-gradient(var(--warn) calc(var(--f) * 1turn),rgba(0,0,0,.18) 0);-webkit-mask:radial-gradient(circle,transparent 66px,#000 67px);mask:radial-gradient(circle,transparent 66px,#000 67px);pointer-events:none}
#throwBtn.lit::before{background:conic-gradient(var(--red) calc(var(--f) * 1turn),rgba(0,0,0,.18) 0)}
#throwBtn.hold{transform:translateY(3px);box-shadow:0 2px 0 #7b1b0f,0 0 0 5px rgba(255,255,255,.85)}
.meter{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);height:116px;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;pointer-events:none}
.meter span{font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.meter b{font-family:var(--disp);font-weight:400;font-size:22px;color:#fff;text-shadow:0 2px 4px #000;font-variant-numeric:tabular-nums}
#angM{left:calc(50% - 150px)}
#powM{left:calc(50% + 86px)}
#gauge{width:18px;height:84px;border-radius:9px;background:rgba(22,24,15,.65);border:2px solid #fff;position:relative;overflow:hidden}
#gfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#5fbf4a,var(--warn) 60%,var(--red))}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,22,14,.5);padding:24px 16px;overflow-y:auto}
.sign{position:relative;background:var(--warn);color:var(--ink);border-radius:8px;padding:28px 22px 20px;width:min(100%,360px);text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sign::before{content:"";position:absolute;inset:0;border-radius:8px;padding:9px;background:repeating-linear-gradient(-45deg,var(--ink) 0 12px,var(--warn) 12px 24px);-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.sign h1{font-family:var(--disp);font-weight:400;font-size:clamp(34px,10.5vw,46px);line-height:1.08;margin:6px 0 0;letter-spacing:.01em}
.sign .sub{font-weight:900;font-size:16px;margin:10px 0 0}
.stamp{position:absolute;top:-20px;right:2px;width:66px;height:66px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:14px;line-height:1.08;transform:rotate(12deg);box-shadow:0 3px 0 #7b1b0f;text-align:center}
.how{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:6px;text-align:left;font-weight:700;font-size:14px}
.how li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.how li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--warn);font-size:12px}
.big{margin-top:18px;font-family:var(--disp);font-size:21px;background:var(--ink);color:var(--warn);border:0;border-radius:12px;padding:13px 20px;cursor:pointer;width:100%;letter-spacing:.04em}
.big.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px;font-size:17px;padding:9px}
.big.x{background:#000;color:#fff;margin-top:10px;font-size:17px;padding:10px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.res-head{font-weight:900;font-size:16px;margin:0}
.res-big{font-family:var(--disp);font-size:clamp(28px,9vw,36px);margin:6px 0 0;line-height:1.15}
.res-time{margin-top:8px;font-family:var(--disp);font-size:52px;font-variant-numeric:tabular-nums;line-height:1}
.res-time small{font-family:var(--body);font-weight:900;font-size:18px;margin-left:4px}
.res-cause{margin:12px 0 0;font-weight:900;font-size:15px;background:rgba(22,24,15,.1);border-radius:8px;padding:8px 10px}
.res-cause span{display:block;font-size:11px;opacity:.7}
.res-note{margin:10px 0 0;font-weight:700;font-size:13px}
.nande{position:absolute;top:-16px;left:-8px;background:var(--ink);color:var(--warn);font-family:var(--disp);font-size:15px;padding:6px 10px;border-radius:6px;transform:rotate(-8deg)}
.entry{display:flex;gap:8px;margin-top:14px}
.entry input{flex:1;min-width:0;font:700 16px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fffaf0;color:var(--ink)}
.entry button{font:900 15px var(--body);background:var(--ink);color:var(--warn);border:0;border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.entry button:disabled{opacity:.5}
.send-msg{margin:8px 0 0;font-weight:700;font-size:13px;min-height:1.2em}
.tabs{display:flex;gap:4px;justify-content:center;margin-top:12px}
.tabs button{font:900 14px var(--body);border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--warn)}
.rlist{list-style:none;margin:12px 0 0;padding:0;max-height:min(52vh,420px);overflow-y:auto;text-align:left;border-top:2px solid var(--ink)}
.rlist li{display:grid;grid-template-columns:30px 1fr auto 34px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(22,24,15,.25)}
.rlist li.top{background:rgba(22,24,15,.1)}
.rlist .no{font-family:var(--disp);font-size:16px;text-align:center}
.rlist .nm{font-weight:900;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm small{display:block;font-weight:700;font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.rlist .sc{font-family:var(--disp);font-size:17px;font-variant-numeric:tabular-nums}
.rlist .pl{width:32px;height:32px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:12px;cursor:pointer}
.rlist .me .nm{color:var(--red)}
.rempty{padding:18px 0;font-weight:700;text-align:center;display:block!important}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--ink);border:1.5px solid rgba(22,24,15,.5);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--warn);border-color:var(--ink)}
#rpBar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#rpBar button{font:900 16px var(--body);background:rgba(22,24,15,.85);color:var(--paper);border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
#globe{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);text-align:center;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 1px 3px #000}
#globe canvas{display:block;margin:0 auto 4px;width:120px;height:120px}
#rw{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 80px);font-family:var(--disp);font-size:30px;color:#fff;text-shadow:0 0 6px #0ff,2px 0 #f0f;pointer-events:none;animation:rwb .5s steps(2) infinite}@keyframes rwb{50%{opacity:.3}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--ink)}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}

      <button class="big x" id="share" data-i="share">Xに投稿</button>
      <button class="big alt" id="resRank" data-i="seeRank">ランキングを見る</button>
    </div>
  </div>

  <div class="overlay" id="rank" hidden>
    <div class="sign">
      <p class="res-big" style="margin:0" data-i="rankTitle">生存ランキング</p>
      <div class="tabs" role="group" aria-label="期間"><button id="tabDay" aria-pressed="true" data-i="today">今日</button><button id="tabAll" aria-pressed="false" data-i="allTime">全期間</button></div>
      <ol class="rlist" id="rlist"></ol>
      <button class="big alt" id="rankClose" data-i="close">とじる</button>
    </div>
  </div>
  <div id="rpBar" hidden><button id="rpBack" data-i="back">もどる</button></div>
  <div id="loading">…</div>
</div>

  } else if (phase === 'fly') {
